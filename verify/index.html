<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner Verification — Run Beyond Limits 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f172a, #312e81); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 18px; color: #e2e8f0; }
  .box { text-align: center; }
  .spin { width: 44px; height: 44px; margin: 0 auto 14px; border: 4px solid rgba(255,255,255,.25);
    border-top-color: #a5b4fc; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  p { font-size: 14px; opacity: .9; }
  .err { color: #fca5a5; display: none; margin-top: 10px; font-size: 12.5px; }
  .links { margin-top: 16px; font-size: 12px; }
  .links a { color: #a5b4fc; }
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="sp"></div>
  <p id="line">Opening runner verification…</p>
  <p class="err" id="errLine"></p>
  <div class="links"><a href="https://jeevananthanv.github.io/marathon_final/">Run Beyond Limits 2026</a></div>
</div>
<script>
(function () {
  function fail(msg) {
    document.getElementById("sp").style.display = "none";
    document.getElementById("line").textContent = "Unable to reach the verification service.";
    var e = document.getElementById("errLine");
    e.textContent = msg || "Please try again in a minute.";
    e.style.display = "block";
  }
  function go() {
    var params = new URLSearchParams(location.search);
    var qs = params.toString();
    fetch("../config.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        var base = String(cfg.backend || "").replace(/\/+$/, "");
        if (!base || !/^https:\/\//.test(base)) { fail("Service not configured yet."); return; }
        location.replace(base + "/verify" + (qs ? "?" + qs : ""));
      })
      .catch(function () { fail("Network problem — check connection and try again."); });
  }
  setTimeout(go, 50);
  setTimeout(function () {
    if (document.getElementById("sp").style.display !== "none") fail("Still loading — tap Retry.");
  }, 12000);
})();
</script>
</body>
</html>
