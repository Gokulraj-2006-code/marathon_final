<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Beyond Limits 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f172a, #312e81); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 18px; color: #e2e8f0; }
  .box { text-align: center; }
  .spin { width: 40px; height: 40px; margin: 0 auto 14px; border: 4px solid rgba(255,255,255,.25);
    border-top-color: #a5b4fc; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  p { font-size: 14px; opacity: .9; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p>Redirecting to Run Beyond Limits 2026…</p>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var qs = params.toString();
  var path = location.pathname.replace(/^\/marathon_final/, "") || "/";
  fetch("/marathon_final/config.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      var base = String(cfg.backend || "").replace(/\/+$/, "");
      if (!base) return;
      location.replace(base + path + (qs ? "?" + qs : ""));
    })
    .catch(function () {});
})();
</script>
</body>
</html>
